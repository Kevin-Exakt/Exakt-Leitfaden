# Fehleranalyse „15-Sekunden-Modus nicht aktiv“
# Pan Oston → Lidl → Zigarettenträger → ITAB
# Inhalt von Exakt-Service vorgegeben (20.11.2026), noch nicht formal freigegeben.
# Der Fehler ist mit der Auswahl des Fehlerbilds bereits festgestellt – die Analyse startet direkt.
typ: diagnose
titel: 15-Sekunden-Modus nicht aktiv
status: entwurf
version: 2
start: instore-communication

knoten:
  - id: instore-communication
    art: frage
    titel: Ist ein Instore-Communication-System verbaut?
    antworten:
      - { label: "Ja", typ: ja, weiter: nicht-moeglich-instore }
      - { label: "Nein", typ: nein, weiter: dip-schalter }

  - id: dip-schalter
    art: anweisung
    titel: DIP-Schalter prüfen
    inhalt:
      - typ: sollwert
        bezeichnung: DIP-Schalter 1 und 2
        wert: jeweils oben
      - typ: bild
        src: /medien/demo/platzhalter.svg
        alt: DIP-Schalter 1 und 2 in Stellung oben
        beschriftung: "Beispielfoto folgt: DIP-Schalter 1 und 2 oben"
    antworten:
      - { label: "Schließt jetzt nach 15 Sekunden von alleine", id: schliesst-jetzt, weiter: behoben }
      - { label: "Schließt weiterhin nicht", id: schliesst-weiterhin-nicht, weiter: eskalation }

  # --- Ergebnisse -------------------------------------------------------
  - id: nicht-moeglich-instore
    art: ergebnis
    ergebnis: in-ordnung
    titel: Mit Instore Communication ist der 15-Sekunden-Modus aktuell nicht möglich
    inhalt:
      - typ: hinweis
        text: Ist ein Instore-Communication-System verbaut, kann der 15-Sekunden-Modus derzeit nicht aktiviert werden. Keine Reparatur nötig.

  - id: behoben
    art: ergebnis
    ergebnis: behoben
    titel: 15-Sekunden-Modus über DIP-Schalter wiederhergestellt

  - id: eskalation
    art: ergebnis
    ergebnis: eskalation
    titel: Innendienst kontaktieren
    inhalt:
      - typ: hinweis
        text: Der 15-Sekunden-Modus funktioniert trotz korrekter DIP-Schalter-Stellung nicht. Zusammenfassung an den Innendienst durchgeben.
