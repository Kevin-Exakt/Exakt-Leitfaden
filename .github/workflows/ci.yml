name: Prüfung

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inhalte prüfen
        run: npm run validate
      - name: Tests
        run: npm test
      - name: Typprüfung
        run: npm run typecheck
      - name: Lint
        run: npm run lint
